[project]
name = "soniox-dictate"
version = "0.1.0"
description = "Real-time speech-to-text dictation for WSL2/Windows using Soniox API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
soniox-dictate = "soniox_dictate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
